# Render Blueprint — free web service (https://render.com/docs/blueprint-spec)
# New → Blueprint → pick this repo. Render asks for ADMIN_PASSWORD on first sync.
#
# NOTE: the free plan has no persistent disk. On every deploy/restart/wake the DB
# is restored from the committed seed/ange.db snapshot (photos, videos, music,
# all content). Admin edits made ON RENDER are lost on restart — edit locally,
# run `npm run db:snapshot`, commit + push instead. Upgrade to a paid plan + disk mounted at /var/data and set
# DATABASE_URL=/var/data/ange.db to keep data.
services:
  - type: web
    name: ange
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run db:restore && npx drizzle-kit push --force && npm run build
    startCommand: npm run db:restore && npx drizzle-kit push --force && npm start
    healthCheckPath: /api/version
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: ./data/ange.db
      - key: TRUST_PROXY
        value: "1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
